name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Static HTML export with Nuxt
        run: npm run generate
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}

      - name: Ensure index.html exists (fallback for prerender 500)
        run: |
          if [ ! -f .output/public/index.html ]; then
            cp .output/public/200.html .output/public/index.html
            echo "Created index.html from 200.html fallback"
          fi

      - name: Generate _headers with correct baseURL
        run: |
          cat > .output/public/_headers << EOF
          /${{ github.event.repository.name }}/_nuxt/*
            Cache-Control: public, max-age=31536000, immutable
          /${{ github.event.repository.name }}/*.jpg
            Cache-Control: public, max-age=31536000, immutable
          /${{ github.event.repository.name }}/*.webp
            Cache-Control: public, max-age=31536000, immutable
          /${{ github.event.repository.name }}/*.png
            Cache-Control: public, max-age=31536000, immutable
          /${{ github.event.repository.name }}/*.ico
            Cache-Control: public, max-age=31536000, immutable
          /${{ github.event.repository.name }}/*.html
            Cache-Control: public, max-age=0, must-revalidate
          /${{ github.event.repository.name }}/
            Cache-Control: public, max-age=0, must-revalidate
          EOF

      - name: Create .nojekyll file
        run: touch .output/public/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4